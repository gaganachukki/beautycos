<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Stackly</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <!-- Login Section -->
    <section class="login-section">
        <div class="login-container">
            <h2 class="login-title">Welcome Back</h2>
            <p class="login-subtitle">Sign in to your Stackly account</p>
            
            <form action="404.html" method="POST" class="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> Remember me
                    </label>
                    <a href="404.html" class="forgot-password">Forgot Password?</a>
                </div>
                
                <button type="submit" class="submit-btn" onclick="window.location.href='404.html'; return false;">Login</button>
            </form>
            
            <p class="signup-link">Don't have an account? <a href="404.html">Sign up here</a></p>
        </div>
    </section>

    <!-- JS script -->
    <script src="js/cart.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
